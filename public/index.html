<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&amp;family=Manrope:wght@400;500;600;650;700;750;800&amp;display=swap" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!-- Security: Content Security Policy restricts what resources the browser may load -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://getform.io; form-action 'self' https://getform.io;" />
    <!-- Security: Limit referrer info sent to external sites -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="Rahul Baragur: product, software, and hands-on projects. Explore my experience at Ford, selected software projects, and work beyond the screen."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" sizes="180x180" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Rahul Baragur</title>
    <link rel="canonical" href="https://rahulbaragur.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rahulbaragur.com/" />
    <meta property="og:title" content="Rahul Baragur" />
    <meta property="og:site_name" content="Rahul Baragur" />
    <meta property="og:description" content="Associate Product Manager at Ford. Software projects, experience, and photography." />
    <meta property="og:image" content="https://rahulbaragur.com/images/rahul-social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RB monogram with Rahul Baragur's name" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rahul Baragur" />
    <meta name="twitter:image" content="https://rahulbaragur.com/images/rahul-social-preview.png" />
  <script>
    try {
      const stored = localStorage.getItem('darkMode');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'true' || (stored === null && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>

    <div id="root"></div>
